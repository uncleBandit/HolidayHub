; ---------------------------------------------------------------------------
; HolidayHub — application PHP settings
; ---------------------------------------------------------------------------

[PHP]
expose_php = Off
memory_limit = 512M
max_execution_time = 60
max_input_time = 60
post_max_size = 32M
upload_max_filesize = 32M
max_file_uploads = 20

; Long-running queue workers need a raised ceiling.
max_input_vars = 5000

; Never leak errors into HTTP responses in production.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

date.timezone = UTC

; Real IP headers from the reverse proxy (nginx). Without this, Laravel logs
; and rate limiting see the container's internal IP for every request.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[Session]
session.cookie_httponly = On
session.cookie_samesite = Lax
session.use_strict_mode = On
