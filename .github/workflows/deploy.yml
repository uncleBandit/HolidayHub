name: deploy-production

# For when an MVP graduates to its own server: the Docker stack in
# compose.prod.yaml (deploy/README.md). Manual only; day-to-day MVP deploys go
# to the shared server through deploy-mvp.yml.
#
# Ships main to a dedicated server.
# Images are built here (the server only pulls), tagged with the commit SHA and
# "latest", then the server pulls them, migrates, and restarts.
#
# Needs, in GitHub → Settings → Secrets and variables → Actions:
#   secrets   LIGHTSAIL_SSH_KEY  private key whose public half is in the
#                                server's ~/.ssh/authorized_keys
#   variables LIGHTSAIL_HOST     the instance's static IP
#             LIGHTSAIL_USER     ubuntu (default)
#             APP_URL            https://holidayhub.unclecanvas.com

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/unclebandit/holidayhub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image tag
        id: tag
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: |
            ${{ env.IMAGE }}-web:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}-web:latest
          cache-from: type=gha

  deploy:
    needs: build
    # Skipped (not failed) until the server is set up and LIGHTSAIL_HOST is set.
    if: vars.LIGHTSAIL_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ vars.LIGHTSAIL_HOST }}
      USER: ${{ vars.LIGHTSAIL_USER || 'ubuntu' }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Copy the stack definition
        run: scp -i ~/.ssh/id_deploy compose.prod.yaml "$USER@$HOST:/opt/holidayhub/compose.prod.yaml"

      - name: Pull, migrate and restart
        run: |
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" \
            TAG="$TAG" REGISTRY_USER="${{ github.actor }}" REGISTRY_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/holidayhub
          export IMAGE_TAG="$TAG"
          compose() { docker compose -f compose.prod.yaml "$@"; }

          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          compose pull --quiet
          docker logout ghcr.io

          compose up -d --wait postgres redis
          compose run --rm app migrate
          compose run --rm app php artisan db:seed --class='Database\Seeders\ProductionSeeder' --force
          compose up -d --remove-orphans

          # Remember the running release, so a reboot or manual `up` keeps it.
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$TAG/" .env

          docker image prune -af --filter "until=168h" >/dev/null
          compose ps
          REMOTE

      - name: Check the site is up
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "${{ vars.APP_URL }}/up" >/dev/null; then
              echo "Live: ${{ vars.APP_URL }} ($TAG)"; exit 0
            fi
            sleep 6
          done
          echo "The site did not answer on /up after the deploy." >&2
          exit 1
