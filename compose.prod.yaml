# ---------------------------------------------------------------------------
# HolidayHub — PRODUCTION stack (AWS Lightsail, holidayhub.unclecanvas.com)
#
# The server never builds: GitHub Actions builds both images and pushes them to
# GHCR, then the deploy job runs, in /opt/holidayhub on the server:
#
#   docker compose -f compose.prod.yaml pull
#   docker compose -f compose.prod.yaml run --rm app migrate
#   docker compose -f compose.prod.yaml up -d --remove-orphans
#
# Everything is configured from /opt/holidayhub/.env (see
# deploy/.env.production.example). Migrations run as one explicit job so that
# containers starting at the same time never race each other.
#
# To try the stack on a laptop: SITE_ADDRESS=:80, then `build` + `up`.
# ---------------------------------------------------------------------------

name: holidayhub-prod

x-app-env: &app-env
  APP_NAME: HolidayHub
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_URL: ${APP_URL:?APP_URL is required}

  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}

  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
  DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_COOKIE: holidayhub_session
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

  # "log" until an SMTP provider (e.g. Amazon SES) is set up; set MAIL_MAILER=smtp then.
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@unclecanvas.com}
  MAIL_FROM_NAME: "HolidayHub"

  FILESYSTEM_DISK: public

  BOOKING_TEST_MODE: ${BOOKING_TEST_MODE:-false}

x-app-base: &app-base
  build:
    context: .
    target: prod
  image: ${APP_IMAGE:-ghcr.io/unclebandit/holidayhub}:${IMAGE_TAG:-latest}
  restart: always
  env_file:
    - .env
  environment:
    <<: *app-env
  volumes:
    # Uploaded photos and films (public disk). Shared with the web server,
    # which serves them through the public/storage link.
    - app-storage:/var/www/html/storage/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # No published port: the database is reachable only on the internal network.

  redis:
    image: redis:7-alpine
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    <<: *app-base
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      target: web
    image: ${APP_IMAGE:-ghcr.io/unclebandit/holidayhub}-web:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      app:
        condition: service_started
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
      ACME_EMAIL: ${ACME_EMAIL:-admin@unclecanvas.com}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - app-storage:/var/www/html/storage/app:ro
      # Certificates and ACME account: must persist, or every restart asks
      # Let's Encrypt for a new certificate (and hits its rate limits).
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  queue:
    <<: *app-base
    command: ["queue"]
    # Scale for throughput on a bigger instance:  ... up -d --scale queue=2

  scheduler:
    <<: *app-base
    command: ["scheduler"]

  # Nightly compressed dump of the database, keeping the last BACKUP_KEEP_DAYS.
  # Copy them off the server too (see deploy/README.md).
  backup:
    image: postgres:17-alpine
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - postgres-backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          file=/backups/holidayhub-$$(date +%Y%m%d-%H%M).dump
          if pg_dump --format=custom --file="$$file"; then
            echo "backup written: $$file"
          else
            echo "backup FAILED" >&2; rm -f "$$file"
          fi
          find /backups -name 'holidayhub-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done

volumes:
  postgres-data:
  postgres-backups:
  redis-data:
  app-storage:
  caddy-data:
  caddy-config:
