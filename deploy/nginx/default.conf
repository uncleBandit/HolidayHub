server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;
    charset utf-8;
    client_max_body_size 32M;

    # Docker's internal DNS resolver. Required for dynamic upstream resolution
    # when the app container is recreated with a new IP.
    resolver 127.0.0.11 valid=30s ipv6=off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss image/svg+xml;

    # Vite builds emit content-hashed filenames, so they are safe to cache
    # forever. Everything else must be revalidated.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|avif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;

        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";

        # Trust the proxy so Laravel sees the real client IP. Without this,
        # rate limiting and audit logs record the nginx container's address.
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST   $host;
        fastcgi_param HTTP_X_FORWARDED_PORT   $server_port;
    }

    # Deny access to dotfiles and sensitive paths.
    location ~ /\.(?!well-known) { deny all; }
    location ~ ^/(app|bootstrap|config|database|docker|deploy|storage|tests|vendor)/ {
        deny all;
        return 404;
    }

    error_log /dev/stderr warn;
    access_log /dev/stdout;
}
